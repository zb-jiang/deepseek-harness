# DSH Web Console 后端配置
# 环境变量:SUPABASE_URL/SUPABASE_ANON_KEY 指向 Supabase 项目(Auth+Storage),
# SUPABASE_DB_HOST/USER/PASSWORD 指向本地 PostgreSQL,
# 参见 docs/plans/2026-08-19-supabase-setup-guide.md 与 docs/plans/2026-09-21-local-pg-setup-guide.md
#
# 所有敏感值通过环境变量注入,不写入仓库。
# 本地开发可在 IDE Run Configuration 配置环境变量,或用 application-dev.yml 覆盖。

server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: dsh-web-console

  # 知识库文档上传上限(与 dsh.knowledge.max-upload-size-mb 共用 KB_MAX_UPLOAD_MB)
  servlet:
    multipart:
      max-file-size: ${KB_MAX_UPLOAD_MB:50}MB
      max-request-size: ${KB_MAX_UPLOAD_MB:50}MB

  # 本地 PostgreSQL 直连;与 Flowable 引擎共享同一 PG 实例的不同 schema
  # Flowable 引擎启动自动建 ACT_* 表(flowable schema),Web Console CRUD 治理元数据表(public schema)
  datasource:
    # connectTimeout/socketTimeout(秒,pgjdbc):网络中断时快速失败,防止查询线程卡死在
    # socket 读上耗尽连接池(症状=前端 30s 超时而后台无报错);全部为小查询,60s 足够宽裕
    url: jdbc:postgresql://${SUPABASE_DB_HOST}:5432/postgres?connectTimeout=10&socketTimeout=60
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # 与 flowable-engine 各分 5,本地 PG 默认 max_connections=100 足够。
      # 恒温 5 条(不用 minimum-idle 缩池):保持常连接避免建连空窗。
      maximum-pool-size: 5
      connection-timeout: 30000
      # 30s 保活探测 + 30 分钟轮换:网络恢复后半死连接及时检出重建,不用等使用时才失败
      keepalive-time: 30000
      max-lifetime: 1800000

  # 静态资源:打包前端 dist 后从 classpath:/static/ 提供(Vite 默认 base=/)
  web:
    resources:
      static-locations: classpath:/static/

# DSH 自定义配置
dsh:
  supabase:
    # JWT issuer claim (Supabase Auth 的 iss 为 https://<ref>.supabase.co/auth/v1)
    # 使用 JwtDecoders.fromIssuerLocation() 自动从 OpenID 发现端点拉取 JWKS 验证签名
    jwt-issuer: ${SUPABASE_URL}/auth/v1

  # Flowable 引擎 REST 客户端配置
  # Web Console 后端通过 RestClient 调 Flowable REST 部署 BPMN/发起实例/查任务
  # 认证走"认证直连 Supabase":Web Console 透传当前用户 JWT 给 Flowable,无需 basic auth
  flowable:
    base-url: ${FLOWABLE_BASE_URL}

  # SkillHub REST 客户端配置(企业 Skill 仓库;浏览器不直连,后端持 token 代理)
  skillhub:
    base-url: ${SKILLHUB_BASE_URL:http://127.0.0.1:8095}
    api-token: ${SKILLHUB_API_TOKEN:}

  # 知识库模块:文件存 Supabase Storage,REST 走透传用户 JWT + anon key apikey 头,无 service_role
  knowledge:
    supabase-url: ${SUPABASE_URL}
    anon-key: ${SUPABASE_ANON_KEY}
    # Tesseract 语言训练数据目录(不配则图片 OCR 标记解析失败)
    tessdata-path: ${TESSDATA_PATH:}
    max-upload-size-mb: ${KB_MAX_UPLOAD_MB:50}

  # 分析看板(设计 2026-09-25 §8):轮询引擎 /actuator/metrics 落 dsh_metrics_sample 表。
  # 白名单内指标逐个采集;带 tag 的指标(如 dsh.backend.task{outcome=...})按引擎返回的
  # availableTags 展开逐值采集,落库名形如 "name{tag=value}"。
  analytics:
    # 轮询间隔(毫秒)
    poll-interval-ms: ${ANALYTICS_POLL_INTERVAL_MS:30000}
    # 指标保留天数(每日 03:30 清理过期行)
    retention-days: ${ANALYTICS_RETENTION_DAYS:90}
    # 轮询白名单(引擎 actuator metrics 指标名;白名单外不采集)
    metrics:
      - dsh.flowable.jobs.async
      - dsh.flowable.jobs.timer
      - dsh.flowable.jobs.deadletter
      - dsh.flowable.jobs.suspended
      - dsh.backend.task
      - dsh.task.escalation
      - hikaricp.connections.active
      - jvm.memory.used
    # 简单阈值告警:指标名 → max 阈值;越限写 ANALYTICS_ALERT 审计事件(同一指标 2h 去重)
    alerts:
      "[dsh.flowable.jobs.deadletter]": 0

logging:
  level:
    com.dsh.console: INFO
    org.springframework.security: INFO
    org.springframework.jdbc.core: INFO
