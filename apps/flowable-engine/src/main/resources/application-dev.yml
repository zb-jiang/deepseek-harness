# 本地开发环境配置
# 启动方式:java -jar dsh-flowable-engine.jar --spring.profiles.active=dev
# 或 IDE Run Configuration 中 Active profiles: dev
#
# 假设本地已有 Supabase 项目(本地 docker 或远程项目)。所有凭据仍从环境变量读取,
# 此文件只调整日志级别和暴露 Flowable 内部细节。

spring:
  flowable:
    # 本地开发保留自动建表,便于重置
    database-schema-update: true

logging:
  level:
    com.dsh.flowable: DEBUG
    org.flowable: DEBUG
    org.flowable.engine.impl.persistence: INFO
    org.flowable.task: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG

# 本地开发时显示 Hikari 连接信息
spring.datasource.hikari:
  leak-detection-threshold: 60000
