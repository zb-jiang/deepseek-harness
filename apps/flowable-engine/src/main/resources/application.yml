# DSH Flowable 引擎服务配置
# 参见 docs/plans/2026-08-19-supabase-setup-guide.md §10.2
#
# 所有敏感值通过环境变量注入,不写入仓库。
# 本地开发可在 IDE Run Configuration 配置环境变量,或用 application-dev.yml 覆盖。

server:
  # 避开 Web Console 后端默认 8080;Flowable REST 端点都挂在同一端口下
  port: 8090
  servlet:
    context-path: /

spring:
  application:
    name: dsh-flowable-engine

  # Supabase Postgres 走 Supavisor session pooler(5432,每客户端连接独占后端,支持完整事务/DDL)
  # 免费版直连域名 db.<ref>.supabase.co 仅 IPv6,无 IPv6 网络的环境解析失败;
  # pooler 域名提供 IPv4。禁止用 transaction 模式(6543),其不支持 prepared statement。
  datasource:
    url: jdbc:postgresql://${SUPABASE_DB_HOST}:5432/postgres
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Supabase session pooler 上限 15;与 web-console 各分 5(合计 10<15,留余量)。
      # 恒温 5 条(不用 minimum-idle 缩池):远端 RTT 高,现建连接要数秒,缩池后突发
      # 请求会排队超时;僵尸进程清理后名额足够,保持常连接避免建连空窗。
      maximum-pool-size: 5
      connection-timeout: 30000
      # 30 分钟轮换连接,回收网络抖动产生的半开连接
      max-lifetime: 1800000

# Flowable 7 Spring Boot starter 配置前缀是顶级 flowable.*(不是 spring.flowable.*);
# 写在 spring 下会被忽略,Flowable 回退到默认 schema=public 把 ACT_* 建到 public 下。
flowable:
  # ACT_* 表建在 flowable schema,与 public schema 业务表隔离
  database-schema: flowable
  # 首次启动自动建表,后续启动比对版本升级
  database-schema-update: false
  # 启用异步 executor:定时器边界事件(超时升级 §6.8)、异步 ServiceTask 需要
  async-executor-activate: true
  # 异步 executor 线程池调优(V1):
  # DSH backend task delegate(async ServiceTask)轮询 backend profile 执行 LLM,耗时长,
  # 默认 pool=2/max=10 队列 20000 对单企业单实例偏大;V1 调小便于资源控制。
  # 生产环境按 LLM 平均耗时和实例并发度调整;LLM 调用属于 I/O 密集,可适当大于 CPU 核数。
  async-executor-core-pool-size: 4
  async-executor-max-pool-size: 16
  # 队列容量:待执行的 async Job 等待队列;满了之后新 Job 拒绝并打 ERROR 日志。
  # V1 设 1000 平衡内存占用与突发流量;实际很难触达上限(自动节点 Job 速率低)。
  async-executor-queue-capacity: 1000
  # Job 锁时长(毫秒):避免多实例并发抢同一 Job 时重复执行。
  # 默认 async-job-lock-time=5min,timer-lock-time=1min;LLM 长耗时不影响锁语义(锁防止并发抢,不是超时)。
  async-executor-async-job-lock-time: 300000
  async-executor-timer-lock-time: 300000
  # 暴露 Flowable 官方 REST API(/process-api/*)
  rest-api-enabled: true
  # 关闭 Flowable 自带用户/组表(ACT_ID_*),身份由 Supabase Auth + platform_users 管
  id-generator: false
  # V1 不需要 Event Registry(外部消息触发流程),禁用避免在 public schema 创建 FLW_* 表
  event-registry:
    enabled: false

# DSH 自定义配置
# Spring Security 不在 yaml 中声明 oauth2.resourceserver;
# 由 SecurityConfig 注册 JwtDecoder 用 JwtDecoders.fromIssuerLocation() 从 Supabase OpenID 端点自动拉取 JWKS
dsh:
  supabase:
    # JWT issuer claim (Supabase Auth 的 iss 为 https://<ref>.supabase.co/auth/v1)
    jwt-issuer: ${SUPABASE_URL}/auth/v1

  # DSH backend task delegate 集成配置(design 2026-09-14 §6.2)
  # DshBackendClient 提交+轮询常驻 backend profile 实例:
  #   POST {dsh:backendTask@backendProfileUrl}/api/backend/tasks → 轮询 GET 任务状态
  # 实例 URL 存在 BPMN 节点上(画布属性面板下拉选择),不在此配置。
  backend:
    # 轮询间隔(秒)
    poll-interval-seconds: 3
    # 单次任务调用总超时(秒,含轮询累计);超时抛异常触发 async Job 重试
    call-timeout-seconds: 600

logging:
  level:
    com.dsh.flowable: INFO
    org.flowable: INFO
    org.springframework.security: INFO
