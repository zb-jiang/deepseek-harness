<style>
:root {
  --brand: #7c3aed;
  --accent: #0ea5e9;
  --warn: #f59e0b;
  --ok: #10b981;
  --surface: #ffffff;
  --surface-muted: #f8fafc;
  --border: #e2e8f0;
  --text: #0f172a;
  --text-muted: #64748b;
  --text-caption: #94a3b8;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  --weight-medium: 500;
  --weight-strong: 600;
}
:root[data-widget-theme="dark"] {
  --brand: #a78bfa;
  --accent: #38bdf8;
  --warn: #fbbf24;
  --ok: #34d399;
  --surface: #1e293b;
  --surface-muted: #0f172a;
  --border: #334155;
  --text: #f1f5f9;
  --text-muted: #94a3b8;
  --text-caption: #64748b;
}
.arch5 { width: 100%; font-family: var(--font-sans); }
.arch5 .header { fill: var(--text); font-size: 15px; font-weight: var(--weight-strong); }
.arch5 .zone-tag { fill: var(--text-caption); font-size: 11px; font-weight: var(--weight-strong); letter-spacing: 1.5px; }
.arch5 .node { fill: var(--surface); stroke: var(--border); stroke-width: 1; }
.arch5 .node-brand { fill: var(--surface); stroke: var(--brand); stroke-width: 2; }
.arch5 .node-accent { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
.arch5 .node-warn { fill: var(--surface); stroke: var(--warn); stroke-width: 2; }
.arch5 .node-ok { fill: var(--surface); stroke: var(--ok); stroke-width: 2; }
.arch5 .title { fill: var(--text); font-size: 14px; font-weight: var(--weight-strong); }
.arch5 .sub { fill: var(--text-muted); font-size: 12px; }
.arch5 .cap { fill: var(--text-caption); font-size: 11px; }
.arch5 .cap-brand { fill: var(--brand); font-size: 11px; font-weight: var(--weight-medium); }
.arch5 .cap-accent { fill: var(--accent); font-size: 11px; font-weight: var(--weight-medium); }
.arch5 .cap-warn { fill: var(--warn); font-size: 11px; font-weight: var(--weight-medium); }
.arch5 .cap-ok { fill: var(--ok); font-size: 11px; font-weight: var(--weight-medium); }
.arch5 .zone { fill: none; stroke: var(--border); stroke-width: 1; stroke-dasharray: 3 3; }
.arch5 .zone-srv { fill: none; stroke: var(--accent); stroke-width: 1; stroke-dasharray: 3 3; opacity: 0.5; }
.arch5 .conn { fill: none; stroke: var(--text-muted); stroke-width: 1.5; stroke-linecap: round; }
.arch5 .conn-brand { fill: none; stroke: var(--brand); stroke-width: 1.5; stroke-linecap: round; }
.arch5 .conn-accent { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-linecap: round; }
.arch5 .conn-warn { fill: none; stroke: var(--warn); stroke-width: 1.5; stroke-linecap: round; }
.arch5 .conn-ok { fill: none; stroke: var(--ok); stroke-width: 1.5; stroke-linecap: round; }
.arch5 .conn-dash { stroke-dasharray: 5 3; }
.arch5 .conn-lbl { fill: var(--text-muted); font-size: 10px; }
.arch5 .conn-lbl-brand { fill: var(--brand); font-size: 10px; }
.arch5 .conn-lbl-accent { fill: var(--accent); font-size: 10px; }
.arch5 .conn-lbl-warn { fill: var(--warn); font-size: 10px; }
.arch5 .conn-lbl-ok { fill: var(--ok); font-size: 10px; }
.arch5 .legend-box { fill: var(--surface-muted); stroke: var(--border); stroke-width: 1; }
</style>
